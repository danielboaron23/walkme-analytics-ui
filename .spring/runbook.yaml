spring: "1.0"

name: WalkMe Analytics UI
description: Vite + React 19 + TypeScript frontend app with Storybook design system

prerequisites:
  - name: Node.js (v22+)
    check: "node --version | grep -E \"v(22|23|24)\\.\" || (echo \"Node.js v22+ required\" && exit 1)"
    required: true

steps:
  - name: Kill ports if in use
    run: npx kill-port 5173 6007 || true
    optional: true
  - name: Install dependencies
    run: npm install
  - name: Start Vite dev server
    run: npm run dev
    background: true
    ready_when:
      type: http
      url: "http://localhost:5173"
      timeout: "120s"
